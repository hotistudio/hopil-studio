<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>호필 스튜디오</title>
<script src="scripts/errors.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="호필 스튜디오">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/app.css?v=0.6.28">
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header id="header">
    <button id="header-title" onclick="goHome()">호필 스튜디오 <span style="font-size:10px;font-weight:400;color:var(--gold2);letter-spacing:.5px;margin-left:2px">v0.6.28 beta</span></button>
    <button class="header-btn" id="menu-toggle" onclick="toggleSidebar()" style="display:none;padding:6px 8px">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 왼쪽 세로선 -->
        <rect x="1" y="1" width="4" height="16" rx="1.5" fill="rgba(255,255,255,0.7)"/>
        <!-- 오른쪽 가로선 3개 -->
        <line x1="7.5" y1="5" x2="16.5" y2="5" stroke="rgba(255,255,255,0.8)" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="7.5" y1="9" x2="16.5" y2="9" stroke="rgba(255,255,255,0.8)" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="7.5" y1="13" x2="16.5" y2="13" stroke="rgba(255,255,255,0.8)" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <span id="header-sep" style="color:rgba(255,255,255,.3);display:none">›</span>
    <span id="header-project"></span>
    <div id="header-spacer"></div>
    <div id="header-actions" style="display:flex;align-items:center;gap:4px;flex-shrink:0">
      <button class="header-btn" onclick="openGlobalSearch()" id="btn-global-search" title="전체 작품 검색 (Ctrl+Shift+F)" style="display:none;font-size:16px;padding:5px 8px">🔎</button>
      <button class="header-btn" onclick="toggleDarkMode()" id="btn-darkmode" title="다크모드 전환" style="font-size:16px;padding:5px 8px">🌙</button>
      <button class="header-btn" onclick="toggleThemePicker()" id="btn-theme" title="테마 색상" style="font-size:16px;padding:5px 8px">🎨</button>

      <span id="file-status" style="margin-right:4px"></span>
      <button class="header-btn" onclick="document.getElementById('import-single-file').click()" id="btn-load-project" style="display:none">📂 <span class="btn-text">작품 불러오기</span></button>
      <button class="header-btn gold" onclick="exportCurrentProject()" id="btn-save-project" style="display:none" title="파일에 저장 (처음엔 파일 선택, 이후 같은 파일에 덮어쓰기)">💾 <span class="btn-text">파일 저장</span></button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    <input type="file" id="import-single-file" accept=".json" style="display:none" onchange="importSingleProject(event)">
  </header>

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div id="sidebar-overlay" style="display:none" onclick="closeSidebar()"></div>

  <!-- BODY -->
  <div id="body">
    <!-- SIDEBAR -->
    <nav id="sidebar" style="display:none">
      <div class="sidebar-project-info">
        <div class="sidebar-project-title" id="sidebar-project-title"></div>
        <div id="sidebar-project-status"></div>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section">집필 홈</div>

        <button class="nav-item" onclick="navigate('stats')" data-tab="stats">

        <button class="nav-item" onclick="navigate('chapters')" data-tab="chapters">

        <button class="nav-item" onclick="navigate('plot')" data-tab="plot">

        </button>
        <button class="nav-item" onclick="navigate('psyarc')" data-tab="psyarc">

        <button class="nav-item" onclick="navigate('chronicle')" data-tab="chronicle">

        </button>
        <div class="nav-section">작품 관리</div>
        <button class="nav-item" onclick="navigate('world')" data-tab="world">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          세계관 설정 <span class="nav-badge" id="badge-world"></span>
        </button>
        <button class="nav-item" onclick="navigate('family')" data-tab="family">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

        </button>
        <button class="nav-item" onclick="navigate('characters')" data-tab="characters">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          등장인물 <span class="nav-badge" id="badge-characters"></span>
        </button>
        <button class="nav-item" onclick="navigate('relations')" data-tab="relations">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><line x1="12" y1="13" x2="5" y2="15"/><line x1="12" y1="13" x2="19" y2="15"/></svg>
          인물 관계도
        </button>
        <button class="nav-item" onclick="navigate('glossary')" data-tab="glossary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="12" y1="7" x2="16" y2="7"/><line x1="12" y1="11" x2="16" y2="11"/><line x1="9" y1="7" x2="9.01" y2="7"/><line x1="9" y1="11" x2="9.01" y2="11"/></svg>
          용어 사전 <span class="nav-badge" id="badge-glossary"></span>
        </button>
        <button class="nav-item" onclick="navigate('items')" data-tab="items">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>

        </button>
        <button class="nav-item" onclick="navigate('memo')" data-tab="memo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          메모장
        </button>
        <div class="nav-section">시각화</div>
        <button class="nav-item" onclick="navigate('narrative')" data-tab="narrative">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h18M3 19h18"/><circle cx="7" cy="5" r="2" fill="currentColor" stroke="none"/><circle cx="13" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="18" cy="19" r="2" fill="currentColor" stroke="none"/></svg>
          서사 타임라인
        </button>
        <button class="nav-item" onclick="navigate('familytree')" data-tab="familytree">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="6" cy="13" r="2.5"/><circle cx="18" cy="13" r="2.5"/><circle cx="9" cy="20" r="2"/><circle cx="15" cy="20" r="2"/><line x1="12" y1="7.5" x2="6" y2="10.5"/><line x1="12" y1="7.5" x2="18" y2="10.5"/><line x1="6" y1="15.5" x2="9" y2="18"/><line x1="6" y1="15.5" x2="15" y2="18"/></svg>
          가계도 <span style="font-size:9px;font-weight:700;background:var(--teal);color:#fff;padding:1px 5px;border-radius:4px;letter-spacing:.3px;vertical-align:middle">NEW</span>

        <button class="nav-item" onclick="navigate('diagram')" data-tab="diagram">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="12" y2="14"/><line x1="12" y1="14" x2="5" y2="16"/><line x1="12" y1="14" x2="19" y2="16"/></svg>
          다이어그램 <span style="font-size:9px;font-weight:700;background:var(--teal);color:#fff;padding:1px 5px;border-radius:4px;letter-spacing:.3px;vertical-align:middle">BETA</span>

        <button class="nav-item" onclick="navigate('manuscript')" data-tab="manuscript">

        </button>

          연재 관리
        </button>
      </div>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-sm" style="width:100%;justify-content:center" onclick="goHome()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

    <!-- MAIN -->
    <main id="main"></main>

</div>
<div id="toast"></div>

<!-- 모바일 화 목록 슬라이드 패널 (main 밖 고정) -->
<div id="mobile-chapter-panel" style="display:none;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;background:var(--cream);border-bottom:1px solid var(--border);flex-shrink:0">
    <span style="font-size:14px;font-weight:700">목록</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-gold btn-sm" onclick="newChapter()" style="padding:6px 12px;font-size:15px;font-weight:700">＋</button>
      <button class="btn btn-outline btn-sm" onclick="newFolder()" style="padding:6px 10px;font-size:13px">📁</button>
      <button onclick="toggleMobileChapterPanel()"
        style="background:none;border:none;font-size:22px;color:var(--muted);
          cursor:pointer;padding:0 4px;line-height:1">×</button>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:8px" id="mobile-chapter-list-body"></div>
</div>
<div id="mobile-chapter-backdrop" onclick="toggleMobileChapterPanel()" style="display:none"></div>

<script src="scripts/app.js?v=0.6.28"></script>

<div id="focus-overlay">
  <div id="focus-toolbar">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-family:'Black Han Sans',sans-serif;font-size:14px;color:var(--gold)">집중 모드</span>
      <span id="focus-wordcount">0자</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <label class="reader-style-control">📖 화면 양식
        <select class="reader-style-select" aria-label="집중 모드 화면 양식" title="집필 화면의 보기만 바뀝니다" onchange="changeReaderStyle(this.value)">
          <option value="default">기본 집필기</option>
          <option value="kakao">카카오페이지풍</option>
          <option value="ridi">리디풍</option>
          <option value="naver">네이버 시리즈풍</option>
          <option value="forest">짙은 녹색</option>
        </select>
      </label>
      <div style="display:flex;align-items:center;gap:4px;background:var(--cream);border:1px solid var(--border);border-radius:7px;padding:2px 6px">
        <button onclick="changeFontSize(-1)" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);padding:2px 4px;font-weight:700">−</button>
        <span id="focus-font-size" style="font-size:11px;color:var(--muted);min-width:28px;text-align:center;font-weight:600">16px</span>
        <button onclick="changeFontSize(1)" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);padding:2px 4px;font-weight:700">＋</button>
      </div>
      <button onclick="toggleFocusRef()" id="focus-ref-btn"
        style="background:transparent;border:1.5px solid var(--border);border-radius:8px;
          padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;
          color:var(--muted);font-family:'Noto Sans KR',sans-serif">⊞ 참고</button>
      <button class="typewriter-toggle" onclick="toggleTypewriterScrolling()" aria-pressed="false"
        title="입력 중인 줄을 화면 가운데에 유지">⌖ 타자기 스크롤</button>
      <button onclick="togglePomodoro()"
        style="background:transparent;border:1.5px solid var(--border);border-radius:8px;
          padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;
          color:var(--muted);font-family:'Noto Sans KR',sans-serif">🍅 집필</button>
      <button id="focus-exit-btn" onclick="exitFocusMode()">✕ 나가기 (ESC)</button>
    </div>
  </div>
  <div id="focus-shortcut-bar" style="padding:5px 12px;background:var(--cream);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex-shrink:0"></div>
  <div style="display:flex;flex:1;overflow:hidden">
    <div id="focus-editor-wrap" style="flex:1;overflow-y:auto;display:flex;justify-content:center;padding:40px 24px">
      <textarea id="focus-editor" placeholder="이야기를 시작하세요..."></textarea>
    </div>
    <!-- 집중 모드 참고 패널 -->
    <div id="focus-ref-panel" style="display:none;width:320px;flex-shrink:0;
      border-left:1.5px solid var(--border);background:var(--paper);
      display:none;flex-direction:column;overflow:hidden">
      <div style="display:flex;gap:2px;padding:8px 10px 0;
        border-bottom:1px solid var(--border);background:var(--cream);flex-shrink:0;overflow-x:auto">
        <button class="split-tab active" onclick="focusRefTab('overview')">📋 개요</button>
        <button class="split-tab" onclick="focusRefTab('world')">🌍 세계관</button>
        <button class="split-tab" onclick="focusRefTab('plot')">📐 플롯</button>
        <button class="split-tab" onclick="focusRefTab('characters')">👤 인물</button>
        <button class="split-tab" onclick="focusRefTab('relations')">🔗 관계도</button>
        <button class="split-tab" onclick="focusRefTab('family')">🏰 가문</button>
        <button class="split-tab" onclick="focusRefTab('glossary')">📖 용어</button>
        <button class="split-tab" onclick="focusRefTab('items')">📦 아이템</button>
        <button class="split-tab" onclick="focusRefTab('memo')">📝 메모</button>
      </div>
      <div id="focus-ref-content" style="flex:1;overflow-y:auto;padding:16px"></div>
      <!-- 화별 메모 고정 -->
      <div style="flex-shrink:0;border-top:1.5px solid var(--border);background:var(--cream)">
        <div style="display:flex;align-items:center;justify-content:space-between;
          padding:6px 14px;cursor:pointer;user-select:none"
          onclick="toggleFocusChapterMemo()">
          <span style="font-size:11px;font-weight:700;color:var(--muted)">
            📝 <span style="color:var(--gold)" id="focus-ch-memo-title">메모</span>의 메모
          </span>
          <span id="focus-ch-memo-arrow" style="font-size:10px;color:var(--muted);
            transition:transform .2s;display:inline-block;transform:rotate(-90deg)">▾</span>
        </div>
        <div id="focus-ch-memo-body" style="display:none;padding:0 10px 10px">
